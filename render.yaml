services:
  - type: web
    name: recommandish-api
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import sys; sys.path.insert(0,'.'); from app.db.init_db import init_db; init_db()"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./recommandish.db
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false